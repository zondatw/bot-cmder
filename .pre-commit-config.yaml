default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: [--line-length=120]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        exclude_types: [json]
        # `connexion` is a real but uncommon English spelling.
        # `soket` / `poling` / `getway` are intentional misspellings
        # used in tests + comments as fail-fast typo examples for
        # env-var validation (SLACK_MODE / TELEGRAM_MODE / DISCORD_MODE).
        args: [-L, "connexion,soket,poling,getway"]
  # Phase 7 — block real personal identifiers (Telegram / Discord /
  # Slack user IDs, ngrok hostnames, Discord App IDs, etc.) from
  # reaching the repo. Custom rules + allowlist live in
  # .gitleaks.toml (auto-discovered by the hook). Pair-with: the CI
  # `secret-scan` job in .github/workflows/ci.yml catches commits
  # that bypassed this hook via `git commit --no-verify`.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
