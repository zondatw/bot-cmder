# Production PyPI publish — issue #20 PR-B.
#
# Triggered by pushing to the `release` branch. Mirrors the
# `zondatw/remote-cmder` pattern — once a beta has been verified on
# test.pypi.org via the `beta` workflow, forward to release:
#
#   git checkout release
#   git merge beta          # forward whatever was just verified
#   git push                # ← this is the trigger
#
# After the workflow goes green, verify https://pypi.org/project/bot-cmder/.
# Optionally draft a GitHub release for archeology — the `release`
# branch's HEAD answers "what's currently on PyPI?" but a tagged
# GitHub release shows up nicer in the repo's release history.
#
# Auth: PyPI Trusted Publishing (OIDC). No long-lived `TWINE_PASSWORD`
# in repo secrets. See docs/release.md for the one-time setup.
#
# Safety: the `release` environment in repo Settings → Environments
# can be configured with required reviewers — when set, this workflow
# pauses at the publish step until someone clicks "Approve" in the
# Actions run page. Recommended for prod pushes.

name: release

on:
  push:
    branches: [release]

# Each push waits for the previous to finish — never overlap publishes.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Build distributions
        run: uv build

      - name: Verify wheel ships expected data files
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/*.whl)
          echo "Inspecting $WHEEL"
          unzip -l "$WHEEL" | grep -q 'bot_cmder/data/app.yaml.example' || (
            echo "ERROR: bot_cmder/data/app.yaml.example missing from wheel"
            exit 1
          )
          unzip -l "$WHEEL" | grep -q 'bot_cmder/auth/migrations/0001_initial.sql' || (
            echo "ERROR: bot_cmder/auth/migrations/0001_initial.sql missing from wheel"
            exit 1
          )
          echo "OK — wheel contents verified"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 30

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/bot-cmder/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `with: password:` — Trusted Publishing supplies the
        # token via the OIDC handshake. Default repository-url is
        # pypi.org, which is what we want here.
