[project]
name = "bot-cmder"
dynamic = ["version"]
description = "Multi-platform SRE ChatOps bot (Telegram / Discord / Slack)"
authors = [{name = "Zonda Yang", email = "u226699@gmail.com"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "pyotp>=2.9",
    "cryptography>=43.0",
    "aiosqlite>=0.20",
    "asyncssh>=2.18",
    "pynacl>=1.5",
    # Phase 6b — Slack Socket Mode WebSocket client. Hand-rolled
    # against the documented protocol (apps.connections.open + WSS +
    # envelope_id ack) instead of pulling in slack-sdk / aiohttp;
    # the protocol is small and the library is single-purpose.
    "websockets>=14.0",
    # Issue #45 — `bot-cmder configure` interactive credential wizard.
    # Provides arrow-key menu / password / confirm widgets via
    # prompt_toolkit. Imported lazily inside cli/configure.py handlers
    # so other subcommands (serve, init, --help) don't pay the import
    # cost.
    "questionary>=2.0",
    # `requests` and `environs` were dropped along with the legacy
    # bot_cmder/modules/hook/ + bot_cmder/settings/ packages: httpx and
    # pydantic-settings cover those needs in the new layout.
]

[project.scripts]
# `pip install bot-cmder` puts this on PATH. Pairs with bot_cmder/__main__.py
# so `bot-cmder serve` and `python -m bot_cmder serve` are equivalent.
bot-cmder = "bot_cmder.cli:main"

[project.urls]
Homepage = "https://github.com/zondatw/bot-cmder"
Repository = "https://github.com/zondatw/bot-cmder"
Issues = "https://github.com/zondatw/bot-cmder/issues"
Changelog = "https://github.com/zondatw/bot-cmder/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ipython>=8.12",
    "mypy>=1.9",
    "ruff>=0.4",
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Dynamic version source: a single `__version__ = "0.X.Y"` line in
# bot_cmder/__init__.py. Bump there before tagging a release; the CLI's
# `bot-cmder --version`, FastAPI's OpenAPI metadata, and the wheel's
# Metadata-Version field all read from that one source of truth.
[tool.hatch.version]
path = "bot_cmder/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["bot_cmder"]
# bot_cmder/data/app.yaml.example + bot_cmder/auth/migrations/*.sql
# ride along automatically because they live under `bot_cmder/`.
# Verified at build time via `unzip -l dist/bot_cmder-*.whl`.

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",  # line length handled by black
    "B008",  # FastAPI Depends() pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["bot_cmder"]
omit = ["bot_cmder/main.py"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
