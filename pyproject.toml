[project]
name = "bot-cmder"
version = "0.1.0"
description = "Multi-platform SRE ChatOps bot (Telegram / Discord / Slack)"
authors = [{name = "zonda yang", email = "u226699@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "pyotp>=2.9",
    # `requests` and `environs` were dropped along with the legacy
    # bot_cmder/modules/hook/ + bot_cmder/settings/ packages: httpx and
    # pydantic-settings cover those needs in the new layout.
]

[dependency-groups]
dev = [
    "ipython>=8.12",
    "mypy>=1.9",
    "ruff>=0.4",
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot_cmder"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",  # line length handled by black
    "B008",  # FastAPI Depends() pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["bot_cmder"]
omit = ["bot_cmder/main.py"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
